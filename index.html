<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف مع التلاوة الصوتية الكاملة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: Tahoma, sans-serif; background: #2c221e; color: #2b2b2b; margin: 0; padding: 10px; padding-bottom: 30px; direction: rtl; }
        .container { max-width: 420px; margin: 0 auto; }
        .nav-bar, .card { background: #fff; padding: 12px; border-radius: 8px; margin-bottom: 16px; box-shadow: 0 3px 6px rgba(0,0,0,0.15); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; }
        select, button { padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; font-family: inherit; }
        button { background: #1b4d3e; color: white; border: none; cursor: pointer; }
        select { border: 1px solid #1b4d3e; color: #1b4d3e; font-weight: bold; width: 170px; font-size: 0.8rem; }
        .index-btn { background: #AD8B73; font-weight: bold; }
        .page-card { background: #fefbf4; border: 3px double #8c6d36; border-radius: 8px; padding: 18px; margin-bottom: 16px; min-height: 250px; }
        .page-header { display: flex; justify-content: space-between; border-bottom: 2px solid #8c6d36; padding-bottom: 8px; margin-bottom: 14px; font-weight: bold; color: #1b4d3e; }
        .audio-box { background: #fdf8ee; padding: 12px; border-radius: 8px; border: 1px solid #e6dcc3; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .play-btn { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: #2b2b2b; }
        .progress-bar { flex-grow: 1; accent-color: #1b4d3e; }
        .page-text { font-family: 'Amiri Quran', 'Amiri', serif; font-size: 1.4rem; line-height: 3.2; text-align: justify; word-spacing: 3px; }
        .ayah-num { color: #8c6d36; font-size: 0.95rem; margin: 0 6px; font-weight: bold; display: inline-block; font-family: Tahoma, sans-serif; }
        .bismillah-title { display: block; text-align: center; font-family: 'Amiri', serif; font-weight: bold; color: #8c6d36; margin: 20px auto; font-size: 1.35rem; width: 85%; border-top: 1px dashed #e6dcc3; border-bottom: 1px dashed #e6dcc3; padding: 8px 0; background: #fffdf9; }
        .tool-title { color: #1b4d3e; font-size: 1.05rem; text-align: center; margin: 0 0 12px 0; border-bottom: 2px solid #eee; padding-bottom: 6px; }

        #indexModal, #athkarModal { display: none; position: fixed; z-index: 10000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); overflow-y: auto; }
        .modal-content { background: #fefbf4; margin: 10% auto; padding: 18px; border: 2px solid #8c6d36; width: 90%; max-width: 400px; border-radius: 8px; }
        .surah-list, .athkar-list { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding-left: 4px; }
        .surah-item, .athkar-cat-item { background: #fff; padding: 10px 12px; border: 1px solid #dcd1b5; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.9rem; align-items: center; font-weight: bold; color: #1b4d3e; }
        .surah-item:hover, .athkar-cat-item:hover { background: #1b4d3e; color: white; }
        .athkar-item-box { background: #fff; padding: 14px; border: 1px solid #dcd1b5; border-radius: 6px; margin-bottom: 10px; font-family: 'Amiri Quran', 'Amiri', serif; font-size: 1.25rem; line-height: 2.4; color: #2b2b2b; }
        
        .prayer-row { display: flex; justify-content: space-between; padding: 6px 10px; border-bottom: 1px dashed #e6dcc3; font-size: 0.9rem; font-weight: bold; color: #2b2b2b; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: #fefbf4; font-size: 1.1rem; margin-bottom: 12px;">المصحف الشريف مع التلاوة الصوتية الكاملة</h1>
        
        <div class="card" style="padding: 8px 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-size: 0.85rem; font-weight: bold; color: #1b4d3e;">🎙️ القارئ:</span>
            <select id="reciterSelect" onchange="changeReciter(this.value)" style="width: 70%;">
                <option value="https://server8.mp3quran.net/afs/">مشاري العفاسي</option>
                <option value="https://server11.mp3quran.net/yasser/">ياسر الدوسري</option>
                <option value="https://server11.mp3quran.net/sds/">عبد الرحمن السديس</option>
            </select>
        </div>
        <div class="nav-bar">
            <div><button onclick="chP(-1)">السابقة</button><button onclick="chP(1)">التالية</button></div>
            <div><select id="pageSelect" onchange="loadPage(this.value)"></select></div>
            <div><button class="index-btn" onclick="modal(true)">الفهرس</button></div>
        </div>
        <div class="page-card">
            <div class="page-header"><span id="sName">الفاتحة</span><span id="pNum">ص 1</span></div>
            <div class="audio-box">
                <button class="play-btn" onclick="togglePlay()"><i class="fa-solid fa-play" id="pIcon"></i></button>
                <input type="range" class="progress-bar" id="progressBar" value="0" min="0" max="100" oninput="audio.currentTime = (this.value/100)*audio.duration">
                <audio id="qAudio" preload="auto"></audio>
            </div>
            <div id="tContent" class="page-text">جاري التحميل...</div>
        </div>

        <div class="card">
            <h3 class="tool-title">التسبيح والاستغفار</h3>
            <div style="text-align: center;">
                <p id="dText" style="color: #AD8B73; font-size: 0.95rem; margin: 6px 0;">سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</p>
                <div style="font-size: 2rem; font-weight: bold; color: #1b4d3e; margin: 5px 0;" id="cnt">0</div>
                <button onclick="cnt++; document.getElementById('cnt').innerText=cnt" style="width: 60%; background: #AD8B73; border-radius: 20px; padding: 10px; margin: 8px 0;">تسبيح</button>
                <div style="margin-top: 6px; display: flex; justify-content: center; gap: 8px;">
                    <button onclick="chDhikr()" style="font-size: 0.8rem; padding: 4px 10px;">تغيير الذكر</button>
                    <button onclick="cnt=0; document.getElementById('cnt').innerText=0" style="background: #c0392b; font-size: 0.8rem; padding: 4px 10px;">تصفير</button>
                </div>
            </div>
        </div>
        <div class="card">
            <h3 class="tool-title">الأذكار</h3>
            <div style="text-align: center;">
                <button onclick="openAthkarModal()" style="width: 100%; background: #1b4d3e; font-weight: bold; padding: 10px; border-radius: 6px;">📖 فتح الأذكار</button>
            </div>
        </div>

        <div class="card">
            <h3 class="tool-title">🕌 مواقيت الصلاة</h3>
            <div id="prayerTimesContainer">
                <div style="text-align: center; font-size: 0.85rem; color: #666;">جاري تحديد المواقيت حسب موقعك...</div>
            </div>
        </div>
    </div>
    <div id="indexModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
                <h3 style="margin:0; color:#1b4d3e; font-size:1rem;">فهرس الآيات</h3>
                <button onclick="modal(false)" style="background:#c0392b; font-size:0.8rem; padding:4px 8px;">إغلاق</button>
            </div>
            <div class="surah-list" id="sGrid"></div>
        </div>
    </div>

    <div id="athkarModal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 2px solid #8c6d36; padding-bottom: 8px;">
                <h3 id="athkarTitle" style="margin:0; color:#1b4d3e; font-size:1rem;">الأذكار</h3>
                <button onclick="closeAthkarModal()" style="background:#c0392b; font-size:0.8rem; padding:4px 8px;">إغلاق</button>
            </div>
            <div id="athkarBody" class="athkar-list"></div>
        </div>
    </div>

    <script>
        const sData = [{n:"الفاتحة",p:1},{n:"البقرة",p:2},{n:"آل عمران",p:50},{n:"النساء",p:77},{n:"المائدة",p:106},{n:"الأنعام",p:128},{n:"الأعراف",p:151},{n:"الأنفال",p:177},{n:"التوبة",p:187},{n:"يونس",p:208},{n:"هود",p:221},{n:"يوسف",p:235},{n:"الرعد",p:250},{n:"إبراهيم",p:255},{n:"الحجر",p:262},{n:"النحل",p:267},{n:"الإسراء",p:282},{n:"الكهف",p:293},{n:"مريم",p:312},{n:"طه",p:312},{n:"الأنبياء",p:322},{n:"الحج",p:332},{n:"المؤمنون",p:342},{n:"النور",p:350},{n:"الفرقان",p:359},{n:"الشعراء",p:367},{n:"النمل",p:377},{n:"القصص",p:385},{n:"العنكبوت",p:396},{n:"الروم",p:404},{n:"لقمان",p:411},{n:"السجدة",p:415},{n:"الأحزاب",p:418},{n:"سبأ",p:428},{n:"فاطر",p:434},{n:"يس",p:440},{n:"الصافات",p:446},{n:"ص",p:453},{n:"الزمر",p:458},{n:"غافر",p:467},{n:"فصلت",p:477},{n:"الشورى",p:483},{n:"الزخرف",p:489},{n:"الدخان",p:496},{n:"الجاثية",p:499},{n:"الأحقاف",p:502},{n:"محمد",p:507},{n:"الفتح",p:511},{n:"الحجرات",p:515},{n:"ق",p:518},{n:"الذاريات",p:520},{n:"الطور",p:523},{n:"النجم",p:526},{n:"القمر",p:528},{n:"الرحمن",p:531},{n:"الواقعة",p:534},{n:"الحديد",p:537},{n:"المجادلة",p:542},{n:"الحشر",p:545},{n:"الممتحنة",p:549},{n:"الصف",p:551},{n:"الجمعة",p:553},{n:"المنافقون",p:554},{n:"التغابن",p:556},{n:"الطلاق",p:558},{n:"التحريم",p:560},{n:"الملك",p:562},{n:"القلم",p:564},{n:"الحاقة",p:566},{n:"المعارج",p:568},{n:"نوح",p:570},{n:"الجن",p:572},{n:"المزمل",p:574},{n:"المدثر",p:575},{n:"القيامة",p:577},{n:"الإنسان",p:578},{n:"المرسلات",p:580},{n:"النبأ",p:582},{n:"النازعات",p:583},{n:"عبس",p:585},{n:"التكوير",p:586},{n:"الانفطار",p:587},{n:"المطففين",p:588},{n:"الانشقاق",p:589},{n:"البروج",p:590},{n:"الطارق",p:591},{n:"الأعلى",p:591},{n:"الغاشية",p:592},{n:"الفجر",p:593},{n:"البلد",p:594},{n:"الشمس",p:595},{n:"الليل",p:595},{n:"الضحى",p:596},{n:"الشرح",p:596},{n:"التين",p:597},{n:"العلق",p:597},{n:"القدر",p:598},{n:"البينة",p:598},{n:"الزلزلة",p:599},{n:"العاديات",p:599},{n:"القارعة",p:600},{n:"التكاثر",p:600},{n:"العصر",p:601},{n:"الهمزة",p:601},{n:"الفيل",p:601},{n:"قريش",p:602},{n:"الماعون",p:602},{n:"الكوثر",p:602},{n:"الكافرون",p:603},{n:"النصر",p:603},{n:"المسد",p:603},{n:"الإخلاص",p:604},{n:"الفلق",p:604},{n:"الناس",p:604}];
        let curP = parseInt(localStorage.getItem('p')) || 1, audio = document.getElementById('qAudio'), cnt = 0;
        let currentLoadedSurahNum = null;

        audio.onplay = () => { document.getElementById('pIcon').className = "fa-solid fa-pause"; };
        audio.onpause = () => { document.getElementById('pIcon').className = "fa-solid fa-play"; };
        audio.onended = () => { document.getElementById('pIcon').className = "fa-solid fa-play"; };

        function getS(p) { let n = "الفاتحة"; for(let i=0; i<sData.length; i++) { if(p >= sData[i].p) n = sData[i].n; } return n; }
        
        function getSurahNumForPage(page) {
            for(let i = sData.length - 1; i >= 0; i--) {
                if(page >= sData[i].p) {
                    return i + 1;
                }
            }
            return 1;
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            let sel = document.getElementById('pageSelect');
            for(let i=1; i<=604; i++) sel.innerHTML += `<option value="${i}">ص ${i} - ${getS(i)}</option>`;
            
            let grid = document.getElementById('sGrid');
            sData.forEach((s, i) => grid.innerHTML += `<div class="surah-item" onclick="loadPage(${s.p}); modal(false);"><span>${i+1}. سورة ${s.n}</span><span>صفحة ${s.p}</span></div>`);
            
            let savedReciter = localStorage.getItem('reciterServer');
            if(savedReciter) { document.getElementById('reciterSelect').value = savedReciter; }

            loadPage(curP);
            fetchPrayerTimes();
        });

        function changeReciter(serverUrl) {
            localStorage.setItem('reciterServer', serverUrl);
            updateAudioForCurrentPage(true);
        }

        function updateAudioForCurrentPage(forceReload = false) {
            let serverUrl = document.getElementById('reciterSelect').value;
            let sNum = getSurahNumForPage(curP);
            let formattedSNum = String(sNum).padStart(3, '0');
            let newSrc = `${serverUrl}${formattedSNum}.mp3`;

            if(audio.src !== newSrc || forceReload) {
                let wasPlaying = !audio.paused;
                audio.src = newSrc;
                audio.load();
                currentLoadedSurahNum = sNum;
                if(wasPlaying || forceReload) {
                    audio.play().catch(e => console.log("Audio play error:", e));
                }
            }
        }

        async function loadPage(p) {
            let oldSurah = getSurahNumForPage(curP);
            curP = parseInt(p); 
            localStorage.setItem('p', curP);
            document.getElementById('pageSelect').value = curP;
            document.getElementById('sName').innerText = "سورة " + getS(curP);
            document.getElementById('pNum').innerText = "ص " + curP;
            
            let newSurah = getSurahNumForPage(curP);

            if (oldSurah !== newSurah || currentLoadedSurahNum !== newSurah) {
                let wasPlaying = !audio.paused;
                audio.pause();
                audio.currentTime = 0;
                currentLoadedSurahNum = newSurah;
                
                let serverUrl = document.getElementById('reciterSelect').value;
                let formattedSNum = String(newSurah).padStart(3, '0');
                audio.src = `${serverUrl}${formattedSNum}.mp3`;
                audio.load();
                
                if (wasPlaying) {
                    audio.play().catch(e => console.log("Audio play error:", e));
                }
            } else {
                updateAudioForCurrentPage();
            }

            try {
                let res = await fetch(`https://api.alquran.cloud/v1/page/${curP}/quran-uthmani`);
                let d = await res.json();

                if(d.code === 200) {
                    let txt = '';
                    
                    d.data.ayahs.forEach((v, idx) => {
                        let t = v.text;
                        let sNum = v.surah.number;
                        let ayahInSurah = v.numberInSurah;
                        
                        // تنظيف النص الأساسي من تكرار البسملة المضمنة في الآية من الـ API
                        t = t.replace(/بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ/g, "")
                             .replace(/بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ/g, "")
                             .trim();

                        // إظهار البسملة بشكل طبيعي لجميع السور عدا سورة التوبة (9)
                        if (ayahInSurah === 1 && sNum !== 9) {
                            if (idx === 0 || (idx > 0 && d.data.ayahs[idx - 1].surah.number !== sNum)) {
                                txt += '<span class="bismillah-title">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</span>';
                            }
                        }

                        if(t) txt += t + ` <span class="ayah-num">(${ayahInSurah})</span> `;
                    });
                    document.getElementById('tContent').innerHTML = txt;
                }
            } catch { 
                document.getElementById('tContent').innerHTML = "خطأ في الاتصال."; 
            }
        }

        function togglePlay() {
            updateAudioForCurrentPage();
            if (audio.paused) {
                audio.play().catch(error => console.log("Playback prevented:", error));
            } else {
                audio.pause();
            }
        }

        audio.ontimeupdate = () => {
            if(audio.duration) {
                let bar = document.getElementById('progressBar');
                bar.value = (audio.currentTime / audio.duration) * 100;
            }
        };

        function chP(d) { 
            let targetP = curP + d;
            if(targetP >= 1 && targetP <= 604) { loadPage(targetP); }
        }
        
        function modal(o) { document.getElementById('indexModal').style.display = o ? 'block' : 'none'; }
        
        let dIdx = 0, dhikrs = ["سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "أَسْتَغْفِرُ اللَّهَ", "سُبْحَانَ اللَّهِ العَظِيمِ", "الْحَمْدُ لِلَّهِ", "لَا إِلهَ إِلَّا اللَّهُ"];
        function chDhikr() { dIdx = (dIdx + 1) % dhikrs.length; document.getElementById('dText').innerText = dhikrs[dIdx]; cnt = 0; document.getElementById('cnt').innerText = 0; }
        
        const athkarCategories = [
            { 
                title: "☀️ أذكار الصباح", 
                items: [
                    "آية الكرسي:<br>اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ...",
                    "سورة الإخلاص، والفلق، والناس <span style='font-family: Tahoma; font-size: 0.85rem; color: #8c6d36;'>(تُقرأ ثلاث مرات)</span>",
                    "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...",
                    "رَضِيتُ بِاللَّهِ رَبّاً، وَبِالْإِسْلَامِ دِيناً، وَبِمحمدٍ نَبِيّاً <span style='font-family: Tahoma; font-size: 0.85rem; color: #8c6d36;'>(تُقرأ ثلاث مرات)</span>"
                ] 
            },
            { 
                title: "🌙 أذكار المساء", 
                items: [
                    "آية الكرسي:<br>اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ...",
                    "سورة الإخلاص، والفلق، والناس <span style='font-family: Tahoma; font-size: 0.85rem; color: #8c6d36;'>(ثلاث مرات)</span>",
                    "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ...",
                    "أَعُوذُ بِكَلِمَاتِ اللَّهِ التَّامَّاتِ مِنْ شَرِّ مَا خَلَقَ <span style='font-family: Tahoma; font-size: 0.85rem; color: #8c6d36;'>(تُقرأ ثلاث مرات)</span>"
                ] 
            },
            { 
                title: "🕌 أذكار بعد الصلاة", 
                items: [
                    "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الجَلَالِ وَالإِكْرَامِ",
                    "لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ"
                ] 
            },
            { 
                title: "🛌 أذكار النوم", 
                items: [
                    "جمع الكفين والنفث فيهما وقراءة المعوذات ثلاثاً ومسح الجسد",
                    "قراءة آية الكرسي وباسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا"
                ] 
            },
            { 
                title: "🌅 أذكار الاستيقاظ", 
                items: [
                    "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ"
                ] 
            }
        ];

        function openAthkarModal() { document.getElementById('athkarModal').style.display = 'block'; showAthkarCategories(); }
        function closeAthkarModal() { document.getElementById('athkarModal').style.display = 'none'; }
        
        function showAthkarCategories() {
            document.getElementById('athkarTitle').innerText = 'الأذكار';
            let body = document.getElementById('athkarBody'); body.innerHTML = '';
            athkarCategories.forEach((cat, index) => {
                body.innerHTML += `<div class="athkar-cat-item" onclick="showAthkarContent(${index})"><span>${cat.title}</span></div>`;
            });
        }

        function showAthkarContent(index) {
            let cat = athkarCategories[index];
            document.getElementById('athkarTitle').innerText = cat.title;
            let body = document.getElementById('athkarBody');
            body.innerHTML = `<button onclick="showAthkarCategories()" style="background:#AD8B73; font-size:0.8rem; padding:6px 10px; margin-bottom:8px; font-weight:bold; width:fit-content;">← رجوع للأقسام</button>`;
            cat.items.forEach((item, i) => {
                body.innerHTML += `<div class="athkar-item-box"><b>(${i+1})</b> ${item}</div>`;
            });
        }

        function fetchPrayerTimes() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    let lat = position.coords.latitude;
                    let lon = position.coords.longitude;
                    loadPrayerAPI(lat, lon);
                }, () => {
                    loadPrayerAPI(31.9544, 35.9106);
                });
            } else {
                loadPrayerAPI(31.9544, 35.9106);
            }
        }

        async function loadPrayerAPI(lat, lon) {
            try {
                let date = new Date();
                let timestamp = Math.floor(date.getTime() / 1000);
                let res = await fetch(`https://api.aladhan.com/v1/timings/${timestamp}?latitude=${lat}&longitude=${lon}&method=5`);
                let data = await res.json();
                if (data.code === 200) {
                    let timings = data.data.timings;
                    let pNames = {
                        Fajr: "الفجر",
                        Dhuhr: "الظهر",
                        Asr: "العصر",
                        Maghrib: "المغرب",
                        Isha: "العشاء"
                    };
                    
                    let html = '';
                    for (let key in pNames) {
                        html += `<div class="prayer-row"><span>${pNames[key]}</span><span>${timings[key]}</span></div>`;
                    }
                    document.getElementById('prayerTimesContainer').innerHTML = html;
                }
            } catch (e) {
                document.getElementById('prayerTimesContainer').innerHTML = '<div style="text-align:center; font-size:0.85rem; color:#c0392b;">تعذر تحميل مواقيت الصلاة</div>';
            }
        }
    </script>
</body>
</html>
