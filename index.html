<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CHAT</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 400px;
      max-width: 90%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 12px;
      text-align: center;
      font-weight: bold;
      font-size: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .voice-select-container {
      font-size: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 5px;
    }
    .voice-select-container select {
      padding: 4px;
      border-radius: 4px;
      border: none;
      outline: none;
      font-size: 12px;
      max-width: 220px;
    }
    .chat-box {
      height: 320px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px;
      border-radius: 5px;
      max-width: 80%;
    }
    .msg.user {
      background: #007bff;
      color: #fff;
      align-self: flex-end;
    }
    .msg.bot {
      background: #e9ecef;
      color: #333;
      align-self: flex-start;
    }
    .input-group {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .input-group input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }
    .input-group button {
      padding: 12px 15px;
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
    .input-group button.mic-btn {
      background: #28a745;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div>AI Chat</div>
      <div class="voice-select-container">
        <label for="voiceSelect">نوع الصوت:</label>
        <select id="voiceSelect"></select>
      </div>
    </div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
      <button class="mic-btn" id="micBtn" onclick="startSpeech()">🎤</button>
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JM03QDd1TP7u2uUaPLN_riMfL7DLcdq8QPXGTCBbrdQg";
    let customVoices = [];

    // إعداد القائمة لتضمن الخيارات الأربعة بشكل مضمون
    function populateVoices() {
      const allVoices = window.speechSynthesis.getVoices();
      const voiceSelect = document.getElementById('voiceSelect');
      voiceSelect.innerHTML = '';
      customVoices = [];

      let arabicVoice = null;
      let englishFemale = null;
      let englishMale = null;

      allVoices.forEach(voice => {
        const lang = voice.lang.toLowerCase();
        const name = voice.name.toLowerCase();

        if (lang.includes('ar') && !arabicVoice) {
          arabicVoice = voice;
        } else if (lang.includes('en')) {
          if ((name.includes('female') || name.includes('zira') || name.includes('hazel') || name.includes('sally')) && !englishFemale) {
            englishFemale = voice;
          } else if ((name.includes('male') || name.includes('george') || name.includes('david') || name.includes('mark')) && !englishMale) {
            englishMale = voice;
          }
        }
      });

      // إذا لم يجد صوت إنجليزي محدد، يأخذ أي صوت متاح
      if (!englishFemale && allVoices.length > 0) englishFemale = allVoices.find(v => v.lang.toLowerCase().includes('en')) || allVoices[0];
      if (!englishMale && allVoices.length > 0) englishMale = allVoices.find(v => v.lang.toLowerCase().includes('en')) || allVoices[0];
      if (!arabicVoice && allVoices.length > 0) arabicVoice = allVoices[0];

      // إضافة الخيارات الأربعة الثابتة مع إعدادات الصوت المناسبة لكل خيار
      const optionsConfig = [
        { name: "بنت عربية", voice: arabicVoice, pitch: 1.2, rate: 1.0 },
        { name: "ولد عربي", voice: arabicVoice, pitch: 0.6, rate: 0.95 }, // حدة منخفضة ليكون صوت ولد
        { name: "بنت إنجليزية", voice: englishFemale, pitch: 1.2, rate: 1.0 },
        { name: "ولد إنجليزي", voice: englishMale, pitch: 0.7, rate: 1.0 }
      ];

      optionsConfig.forEach((item, index) => {
        if (item.voice) {
          customVoices.push(item);
          const option = document.createElement('option');
          option.value = index;
          option.textContent = item.name;
          voiceSelect.appendChild(option);
        }
      });
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = populateVoices;
      setTimeout(populateVoices, 100);
    }

    async function startSpeech() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert("المتصفح لا يدعم التعرف الصوتي. يرجى فتح الصفحة من متصفح Google Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'ar-SA';
      recognition.interimResults = false;

      const micBtn = document.getElementById('micBtn');
      micBtn.style.background = '#dc3545';

      recognition.start();

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        sendMessage();
      };

      recognition.onerror = function(event) {
        alert("خطأ في الميكروفون: " + event.error);
        micBtn.style.background = '#28a745';
      };

      recognition.onend = function() {
        micBtn.style.background = '#28a745';
      };
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const message = input.value.trim();

      if (message === "") return;

      chatBox.innerHTML += `<div class="msg user">${message}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingEl = document.createElement('div');
      loadingEl.className = 'msg bot';
      loadingEl.innerText = 'يرجى الانتظار...';
      chatBox.appendChild(loadingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: message }] }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          loadingEl.innerText = "حدث خطأ: " + data.error.message;
        } else {
          const reply = data.candidates[0].content.parts[0].text;
          loadingEl.innerText = reply;
          speakReply(reply);
        }
      } catch (error) {
        loadingEl.innerText = "تعذر الاتصال بالخدمة.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function speakReply(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        
        const voiceSelect = document.getElementById('voiceSelect');
        const selectedIndex = voiceSelect.value;
        
        if (customVoices[selectedIndex]) {
          const config = customVoices[selectedIndex];
          utterance.voice = config.voice;
          utterance.lang = config.voice.lang;
          utterance.pitch = config.pitch; // تطبيق حدة الصوت المخصصة (خشن أو رفيع)
          utterance.rate = config.rate;   // تطبيق السرعة
        }

        window.speechSynthesis.speak(utterance);
      }
    }
  </script>

</body>
</html>
