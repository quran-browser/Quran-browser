<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مساعد الذكاء الاصطناعي</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 400px;
      max-width: 90%;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      background: #007bff;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-weight: bold;
    }
    .chat-box {
      height: 350px;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      padding: 10px;
      border-radius: 5px;
      max-width: 80%;
    }
    .msg.user {
      background: #007bff;
      color: #fff;
      align-self: flex-end;
    }
    .msg.bot {
      background: #e9ecef;
      color: #333;
      align-self: flex-start;
    }
    .input-group {
      display: flex;
      border-top: 1px solid #ddd;
    }
    .input-group input {
      flex: 1;
      padding: 12px;
      border: none;
      outline: none;
    }
    .input-group button {
      padding: 12px 20px;
      background: #007bff;
      color: #fff;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">مساعد الذكاء الاصطناعي</div>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
      <input type="text" id="userInput" placeholder="اكتب رسالتك هنا...">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6Il0Gj0isXtx6ITJltK16eSIV049zRRz049jMX-nCOR0Q";

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const message = input.value.trim();

      if (message === "") return;

      chatBox.innerHTML += `<div class="msg user">${message}</div>`;
      input.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      const loadingEl = document.createElement('div');
      loadingEl.className = 'msg bot';
      loadingEl.innerText = 'جاري التفكير...';
      chatBox.appendChild(loadingEl);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: message }] }]
          })
        });

        const data = await response.json();
        
        if (data.error) {
          loadingEl.innerText = "حدث خطأ: " + data.error.message;
        } else {
          const reply = data.candidates[0].content.parts[0].text;
          loadingEl.innerText = reply;
        }
      } catch (error) {
        loadingEl.innerText = "تعذر الاتصال بالخدمة.";
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
