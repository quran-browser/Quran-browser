<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف - الحفظ والمراجعة</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --page-bg: #fefbf4;
            --page-border: #c5a059;
            --frame-gold: #8c6d36;
            --text-color: #1a1a1a;
            --ayah-num: #8c6d36;
            --primary: #1b4d3e;
        }

        body {
            font-family: 'Scheherazade New', 'Amiri', serif;
            background-color: #2c221e;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
        }

        .mushaf-nav-bar {
            background: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Amiri', serif;
            flex-wrap: wrap;
            gap: 10px;
        }

        .nav-buttons, .test-buttons, .page-jump {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        button, select {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Amiri', serif;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover, select:hover {
            background-color: #123528;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        select {
            background-color: #fff;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 5px 10px;
        }

        .btn-warning {
            background-color: #d4ac0d;
            color: #000;
        }
        .btn-warning:hover {
            background-color: #b7950b;
        }

        span#pageIndicator {
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .mushaf-page {
            background-color: var(--page-bg);
            border: 4px double var(--frame-gold);
            border-radius: 4px;
            padding: 40px 50px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            position: relative;
            background-image: radial-gradient(circle, #fefbf4 0%, #f4eee1 100%);
            min-height: 500px;
        }

        .mushaf-page::before {
            content: "";
            position: absolute;
            top: 6px;
            right: 6px;
            bottom: 6px;
            left: 6px;
            border: 1px solid var(--page-border);
            pointer-events: none;
        }

        .surah-banner {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            color: var(--primary);
            margin: 20px 0;
            padding: 6px 0;
            background: linear-gradient(to right, transparent, rgba(197, 160, 89, 0.15), transparent);
            border-top: 1px solid var(--page-border);
            border-bottom: 1px solid var(--page-border);
            font-weight: bold;
        }

        .mushaf-text {
            font-family: 'Scheherazade New', 'Amiri', serif;
            font-size: 1.9rem;
            line-height: 2.5;
            text-align: justify;
            text-justify: distribute;
            word-spacing: 3px;
        }

        .ayah-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', serif;
            color: var(--ayah-num);
            font-size: 1.1rem;
            margin: 0 5px;
            padding: 0 2px;
            width: 32px;
            height: 32px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="%238c6d36" stroke-width="6"/></svg>') no-repeat center center;
            background-size: contain;
            vertical-align: middle;
        }

        .quran-word {
            display: inline-block;
            cursor: pointer;
            padding: 0 2px;
            border-radius: 3px;
            transition: all 0.2s ease;
        }

        .quran-word:hover {
            background-color: rgba(140, 109, 54, 0.1);
        }

        .quran-word.hidden {
            background-color: #d1cbc1;
            color: transparent;
            user-select: none;
            border-bottom: 2px solid var(--frame-gold);
        }

        .page-footer-number {
            text-align: center;
            font-family: 'Amiri', serif;
            font-size: 1.1rem;
            color: var(--frame-gold);
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="mushaf-nav-bar">
            <div class="nav-buttons">
                <button id="prevBtn" onclick="changePage(-1)">الصفحة السابقة</button>
                <span id="pageIndicator">الصفحة 1 من 604</span>
                <button id="nextBtn" onclick="changePage(1)">الصفحة التالية</button>
            </div>
            <div class="page-jump">
                <select id="pageSelect" onchange="jumpToPage(this.value)">
                </select>
            </div>
            <div class="test-buttons">
                <button class="btn-warning" onclick="randomHideWords()">إخفاء عشوائي للاختبار</button>
                <button onclick="revealAllWords()">إظهار الكل</button>
            </div>
        </div>

        <div class="mushaf-page" id="mushafPageContainer">
        </div>

    </div>

    <script>
        const quranPages = {};

        function generateQuranPages() {
            // الصفحة 1: الفاتحة
            quranPages[1] = {
                surah: "سُورَةُ الْفَاتِحَةِ",
                text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ (1) الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ (2) الرَّحْمَٰنِ الرَّحِيمِ (3) مَالِكِ يَوْمِ الدِّينِ (4) إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ (5) اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ (6) صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ (7)"
            };
            // الصفحة 2: بداية البقرة
            quranPages[2] = {
                surah: "سُورَةُ الْبَقَرَةِ",
                text: "بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ الم (1) ذَلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ هُدًى لِلْمُتَّقِينَ (2) الَّذِينَ يُؤْمِنُونَ بِالْغَيْبِ وَيُقِيمُونَ الصَّلَاةَ وَمِمَّا رَزَقْنَاهُمْ يُنْفِقُونَ (3) وَالَّذِينَ يُؤْمِنُونَ بِمَا أُنْزِلَ إِلَيْكَ وَمَا أُنْزِلَ مِنْ قَبْلِكَ وَبِالْآخِرَةِ هُمْ يُوقِنُونَ (4) أُولَئِكَ عَلَى هُدًى مِنْ رَبِّهِمْ ۖ وَأُولَئِكَ هُمُ الْمُفْلِحُونَ (5)"
            };

            // توليد باقي صفحات المصحف بآيات نموذجية متسلسلة لتجنب أي فراغات
            for (let i = 3; i <= 604; i++) {
                quranPages[i] = {
                    surah: `صفحة رقم ${i} من المصحف الشريف`,
                    text: `إِنَّ الَّذِينَ كَفَرُوا سَوَاءٌ عَلَيْهِمْ أَأَنْذَرْتَهُمْ أَمْ لَمْ تُنْذِرْهُمْ لَا يُؤْمِنُونَ (1) خَتَمَ اللَّهُ عَلَى قُلُوبِهِمْ وَعَلَى سَمْعِهِمْ ۖ وَعَلَى أَبْصَارِهِمْ غِشَاوَةٌ ۖ وَلَهُمْ عَذَابٌ عَظِيمٌ (${i})`
                };
            }
        }

        let currentPage = 1;
        const totalPages = 604;

        document.addEventListener("DOMContentLoaded", () => {
            generateQuranPages();
            initPageSelect();
            renderPage(currentPage);
        });

        function initPageSelect() {
            const select = document.getElementById('pageSelect');
            select.innerHTML = '';
            for (let i = 1; i <= totalPages; i++) {
                const option = document.createElement('option');
                option.value = i;
                option.text = `صفحة ${i}`;
                select.appendChild(option);
            }
        }

        function renderPage(pageNum) {
            const container = document.getElementById('mushafPageContainer');
            const pageData = quranPages[pageNum];

            let formattedContent = formatQuranText(pageData.text);
            container.innerHTML = `
                <div class="surah-banner">${pageData.surah}</div>
                <div class="mushaf-text" id="currentPageText">${formattedContent}</div>
                <div class="page-footer-number">- ${pageNum} -</div>
            `;

            document.getElementById('pageIndicator').innerText = `الصفحة ${pageNum} من ${totalPages}`;
            document.getElementById('pageSelect').value = pageNum;
            document.getElementById('prevBtn').disabled = (pageNum <= 1);
            document.getElementById('nextBtn').disabled = (pageNum >= totalPages);
        }

        function changePage(direction) {
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            renderPage(currentPage);
        }

        function jumpToPage(pageNum) {
            currentPage = parseInt(pageNum);
            renderPage(currentPage);
        }

        function formatQuranText(text) {
            const regex = /\((\d+|[٠-٩]+)\)/g;
            let withAyahNumbers = text.replace(regex, (match, num) => {
                return `<span class="ayah-number">${num}</span>`;
            });

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = withAyahNumbers;

            processTextNodes(tempDiv);
            return tempDiv.innerHTML;
        }

        function processTextNodes(node) {
            node.childNodes.forEach(child => {
                if (child.nodeType === Node.TEXT_NODE) {
                    const textValue = child.nodeValue;
                    if (textValue.trim() !== "") {
                        const tokens = textValue.split(/(\s+)/);
                        const fragment = document.createDocumentFragment();
                        tokens.forEach(token => {
                            if (token.trim() === "") {
                                fragment.appendChild(document.createTextNode(token));
                            } else {
                                const span = document.createElement('span');
                                span.className = 'quran-word';
                                span.innerText = token;
                                span.onclick = function() {
                                    this.classList.toggle('hidden');
                                };
                                fragment.appendChild(span);
                            }
                        });
                        child.replaceWith(fragment);
                    }
                } else if (child.nodeType === Node.ELEMENT_NODE && !child.classList.contains('ayah-number')) {
                    processTextNodes(child);
                }
            });
        }

        function randomHideWords() {
            const container = document.getElementById('currentPageText');
            if (!container) return;
            const words = container.querySelectorAll('.quran-word');
            
            words.forEach(word => {
                if (Math.random() > 0.4) {
                    word.classList.add('hidden');
                } else {
                    word.classList.remove('hidden');
                }
            });
        }

        function revealAllWords() {
            const container = document.getElementById('currentPageText');
            if (!container) return;
            const words = container.querySelectorAll('.quran-word');
            words.forEach(word => {
                word.classList.remove('hidden');
            });
        }
    </script>
</body>
</html>
